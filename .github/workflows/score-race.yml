name: score-race

on:
  schedule:
    # Every 15 minutes on Sunday and Monday (UTC): OpenF1 carries the final
    # classification within the hour of the flag, and the Driver of the Day
    # follows on formula1.com — a quarter-hour cadence is what turns that
    # into a result mail the same evening. Hourly the rest of the week, for
    # the ten-day re-score window (Ergast supersedes, late DotD, late SC).
    - cron: "*/15 * * * 0,1"
    - cron: "45 * * * 2-6"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Re-score these rounds whatever their age (e.g. 13, or 1-13). Empty = the scheduled pass."
        type: string
        required: false
      dry_run:
        description: "Dry run — compute and print, write nothing, mail nobody"
        type: boolean
        default: false
      verbose:
        description: "Show FastF1's own INFO/WARNING output (why a source failed)"
        type: boolean
        default: false

concurrency:
  group: game-jobs
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Skip cleanly (green, no failure email) until the Supabase secrets exist.
      - name: Check configuration
        id: guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets not set — skipping score-race. Add SUPABASE_URL and SUPABASE_SERVICE_KEY in repo settings to enable it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.guard.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: fastf1_cache
          key: fastf1-${{ github.run_id }}
          restore-keys: fastf1-
      - if: steps.guard.outputs.configured == 'true'
        run: pip install -r requirements.txt
      - if: steps.guard.outputs.configured == 'true'
        run: |
          python -u jobs/score_race.py \
            ${{ inputs.rounds != '' && format('--rounds {0}', inputs.rounds) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional. Unset, every send is a logged no-op and the job is
          # otherwise unchanged — the reminders simply don't go out.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
          # src/predict.py silences FastF1 at CRITICAL, and FastF1 reports a
          # source it could not load as a WARNING before carrying on — so a
          # scoring pass with no data cannot say why. Tick this on a manual run.
          FASTF1_VERBOSE: ${{ inputs.verbose && '1' || '' }}
